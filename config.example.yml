# Tokens come from GITHUB_TOKEN and SLACK_TOKEN (environment or .env.local).
# SLACK_CHANNEL there overrides slack.channel.

mute: # not forwarded
  events: [merged, ci_running] # event kinds listed in README
  # https://docs.github.com/en/rest/activity/notifications#about-notification-reasons
  reasons: [approval_requested, invitation, manual, member_feature_requested, security_advisory_credit, security_alert, subscribed]
  repositories: [] # owner/repo
  read: false # notifications already read on GitHub

mark_as_read: true
sort_oldest_first: true
rollup: true # one Slack message per check instead of one per notification
ci_only_on_change: true # skip CI updates whose state (failed/running/all green) is unchanged for the PR
ci_ignore_checks: # owner/repo: workflow or check run names left out of CI results
  owner/repo: [Spell check, Label check]
state_file: state.json

slack:
  channel: "" # channel or user ID
  # username and icon require the chat:write.customize scope
  username: GitHub
  icon_url: https://avatars.githubusercontent.com/u/9919?s=460&v=4
  icon_emoji: ""
